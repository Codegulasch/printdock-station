name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - name: PlatformIO installieren
        run: pip install platformio
      - name: Bauen
        run: |
          case "$GITHUB_REF" in refs/tags/v*) export FW_VERSION=${GITHUB_REF_NAME#v};; esac
          pio run
      - name: Dateien sammeln
        run: |
          mkdir -p dist
          VERSION=$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -c4-)
          case "$GITHUB_REF" in refs/tags/v*) VERSION=${GITHUB_REF_NAME#v};; esac
          for env in esp32dev d1_mini32; do
            cp .pio/build/$env/printdock-station-$env.factory.bin dist/printdock-station-$env-$VERSION.factory.bin
            cp .pio/build/$env/firmware.bin dist/printdock-station-$env-$VERSION.ota.bin
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*.bin
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          generate_release_notes: true
