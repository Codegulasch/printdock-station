; PrintDock Station – Firmware
; Bauen:   pio run                 (alle Boards)
;          pio run -e esp32dev     (ESP32-WROOM-32 DevKit)
;          pio run -e d1_mini32    (Wemos/LOLIN D1 Mini ESP32)
; Flashen: pio run -e esp32dev -t upload
; Komplettes Image zum Flashen im Browser (web.esphome.io): tools/merge_bin.py legt
;          .pio/build/<env>/printdock-station-<env>.factory.bin an (Adresse 0x0)

[platformio]
default_envs = esp32dev, d1_mini32

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
build_flags =
  -DFW_VERSION=\"0.1.0\"
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  adafruit/Adafruit PN532@^1.3.3
  bogde/HX711@^0.7.5
  olikraus/U8g2@^2.35.19
  adafruit/Adafruit NeoPixel@^1.12.3
  bblanchon/ArduinoJson@^7.2.1
  links2004/WebSockets@^2.6.1
  https://github.com/tzapu/WiFiManager.git#v2.0.17
extra_scripts = post:tools/merge_bin.py

[env:esp32dev]
board = esp32dev

[env:d1_mini32]
board = wemos_d1_mini32
